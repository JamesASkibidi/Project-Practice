<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TO DO: Signup</title>
    </head>
    <body>
        <h1>TO DO</h1>
        <h2>Signup</h2>
        
        <form action = '/signup' method = "post">
            <div>
                <label for='username'> Username: </label>
                <input type = 'text' id = 'username' placeholder="JohnSmith" name = 'username'>
            </div>
            <div>
                <label for='email'> Email: </label>
                <input type = 'email' id = 'email' placeholder="johnsmith@domain.com" name = 'email'>
            </div>
            <div>
                <label for='password'> Password: </label >
                <input type = 'password' id = 'password' placeholder="StrongPassword123!" name = 'password'>
            </div>
            <div>
                <label for='re-password'> Confirm password: </label>
                <input type = 'password' id = 're-password'  name = 're-password'>
            </div>
            <input type = 'submit' value = 'Create Account'>
        </form>


    </body>
</html>
