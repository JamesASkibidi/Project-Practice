<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/style.css">
        <title>TO DO: Signup</title>
    </head>
    <body>

        <h1>TO DO</h1>
        <h2>Signup</h2>
        
        <form action = '/signup' method = "post">
            <div>
                <label for='username'> Username*: </label>
                <input type = 'text' id = 'username' placeholder="JohnSmith67" name = 'username' required minlength="4">
            </div>
            <div>
                <label for='email'> Email: </label>
                <input type = 'email' id = 'email' placeholder="johnsmith@domain.com" name = 'email'>
            </div>
            <div>
                <label for='password'> Password*: </label >
                    <input type = 'password' id = 'password' placeholder="StrongPassword123!" name = 'password' required minlength="8">
                </div>
                <div>
                    <label for='re-password'> Confirm password*: </label>
                    <input type = 'password' id = 're-password'  name = 're-password' required>
                </div>
                {% with messages = get_flashed_messages() %}
                    {% for message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <input type = 'submit' value = 'Create Account'>

                <p>Already have an account? <a href = "/"> Click Here</a></p>
            </form>
            
            
        </body>
        </html>
